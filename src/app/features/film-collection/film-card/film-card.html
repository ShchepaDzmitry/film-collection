<div class="film-card__container" [routerLink]="[film().id]">
  <h4 class="film-card__title">{{ film().title }}</h4>
  <span class="material-icons" (click)="toggleFavorite($event)">
    {{ film().isFavorite ? 'favorite' : 'favorite_border' }}
  </span>
  <img src="{{ film().posterUrl }}" alt="{{ film().posterUrl }}" />
  <div class="film-card__stats">
    <span>{{ film().year }}</span>
    <span>{{ film().genre }}</span>
    <span>{{ film().rating }}</span>
  </div>
</div>
